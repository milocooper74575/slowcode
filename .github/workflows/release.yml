name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --locked --release -p slowcode-cli --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          stage="dist/slowcode"
          mkdir -p "$stage"
          cp "target/${target}/release/slowcode" "$stage/"
          cp LICENSE README.md SECURITY.md "$stage/"
          archive="slowcode-${target}.tar.gz"
          tar -C dist -czf "dist/${archive}" slowcode
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "dist/${archive}" | awk '{print $1}' > "dist/${archive}.sha256"
          else
            shasum -a 256 "dist/${archive}" | awk '{print $1}' > "dist/${archive}.sha256"
          fi
          "$stage/slowcode" --version

      - uses: actions/upload-artifact@v4
        with:
          name: slowcode-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
