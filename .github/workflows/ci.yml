name: ci

on:
  push:
    branches: [main]
  pull_request: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Test
        run: cargo test --workspace --exclude slowcode-kernel

      - name: Docs check
        run: cargo run -p slowcode-docs -- check

      - name: Docs site is current
        run: cargo run -p slowcode-docs -- build --check

      - name: Clippy
        run: scripts/clippy.sh
