[package]
name = "slowcode-skills"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Local skill installation for slowcode"
license = "MIT"
publish = false

[lib]
name = "slowcode_skills"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
slowcode-kernel = { workspace = true }
slowcode-roles = { workspace = true }
thiserror = "2.0"
