[package]
name = "slowcode-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Terminal user interface for slowcode"
license = "MIT"
publish = false

[lib]
name = "slowcode_tui"
path = "src/lib.rs"

[dependencies]
arboard = "3"
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = "0.3"
ratatui = { version = "0.28", features = ["unstable-rendered-line-info"] }
slowcode-app = { path = "../slowcode-app" }
slowcode-context = { path = "../slowcode-context" }
slowcode-feedback = { path = "../slowcode-feedback" }
slowcode-kernel = { workspace = true }
slowcode-mcp = { path = "../slowcode-mcp" }
slowcode-roles = { workspace = true }
slowcode-skills = { path = "../slowcode-skills" }
thiserror = "2.0"
tokio = { version = "1.53", features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7"
