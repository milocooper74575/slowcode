[package]
name = "slowcode-docs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Static docs site and the single task source for slowcode"
license = "MIT"
publish = false

[lib]
name = "slowcode_docs"
path = "src/lib.rs"

[[bin]]
name = "slowcode-docs"
path = "src/main.rs"

[dependencies]
pulldown-cmark = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
