[package]
name = "slowcode-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "MCP configuration and client bridge for slowcode"
license = "MIT"
publish = false

[lib]
name = "slowcode_mcp"
path = "src/lib.rs"

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slowcode-kernel = { workspace = true }
thiserror = "2.0"
tokio = { version = "1.53", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-util = "0.7"
